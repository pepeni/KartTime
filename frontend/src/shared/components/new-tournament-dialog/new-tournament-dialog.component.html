<div mat-dialog-title class="title">Create tournament</div>
<div mat-dialog-content class="content">
    <form [formGroup]="createForm">
        <mat-form-field>
            <mat-label>Tournament Name</mat-label>
            <input matInput formControlName="name" />
            @if (createForm.get('name')?.hasError('required')) {
                <mat-error>
                    Name is required.
                </mat-error>
            }
        </mat-form-field>
        <mat-form-field>
            <mat-label>Tournament court</mat-label>
            <mat-select formControlName="court">
                @for (court of courts; track court.id) {
                    <mat-option [value]="court">{{court.track_name}}</mat-option>
                  }
            </mat-select>
            <mat-error *ngIf="createForm.get('court')?.hasError('required')">
                You need to select a court.
            </mat-error>
        </mat-form-field>
    </form>
</div>
<div mat-dialog-actions class="footer">
    <button mat-stroked-button mat-dialog-close color="primary">Cancel</button>
    <button mat-flat-button color="primary" [disabled]="actionDisabled()" (click)="createTournament()">Create</button>
</div>
